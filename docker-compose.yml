name: dreyes19_runtime
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - db-data:/var/lib/postgresql/data
  web:
    image: odoo:19.0-20261015
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      CLOVER_TOKEN_ENCRYPTION_KEY: ${CLOVER_TOKEN_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:${ODOO_HTTP_PORT:-8069}:8069"
    volumes:
      - ./addons:/mnt/addons:ro
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - web-data:/var/lib/odoo
volumes:
  db-data:
  web-data:
