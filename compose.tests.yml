name: dreyes19-repository-tests
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: isolated-test-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 15
    volumes:
      - test-db:/var/lib/postgresql/data
  web:
    image: odoo:19.0-20261015
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: isolated-test-database
    volumes:
      - ./addons:/mnt/addons:ro
      - test-web:/var/lib/odoo
    command:
      - odoo
      - --addons-path=/mnt/addons,/mnt/addons/oca/web
      - -d
      - dreyes19_repository_tests
      - -i
      - dreyes_portal,dreyes_client,dreyes_dist,dreyes_dist_clients,dreyes_product_pricing,dreyes_clover_sync,pwa_badge,web_responsive,web_pwa_customize
      - -u
      - dreyes_portal,dreyes_client,dreyes_dist,dreyes_dist_clients,dreyes_product_pricing,dreyes_clover_sync,pwa_badge,web_responsive,web_pwa_customize
      - --test-enable
      - --test-tags=/dreyes_client,/dreyes_dist,/dreyes_dist_clients,/dreyes_product_pricing,/dreyes_clover_sync,/pwa_badge
      - --stop-after-init
      - --max-cron-threads=0
volumes:
  test-db:
  test-web:
